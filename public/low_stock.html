<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คของต้องซื้อ & ตรวจนับสต็อก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Sarabun + Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        *, body, button, input, select, textarea, h1, h2, h3, h4, p, span, div {
            font-family: 'Sarabun', 'Inter', sans-serif !important;
        }

        .line-clamp-1, .line-clamp-2 {
            padding-top: 0.15rem;
            line-height: 1.5 !important;
        }
        button, input, h1, h2, h3, p, span {
            line-height: 1.5;
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-button {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        ::-webkit-scrollbar-track {
            background: transparent !important;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 9999px !important;
            border: none !important;
            min-height: 40px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: #94a3b8;
        }

        /* ซ่อน Scrollbar สำหรับแถบหมวดหมู่ */
        #category-scroll-list,
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        #category-scroll-list::-webkit-scrollbar,
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        @keyframes scannerLaser {
            0% { transform: translateY(-40px); opacity: 0.8; }
            50% { transform: translateY(40px); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0.8; }
        }
        .animate-laser {
            animation: scannerLaser 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100/70 font-sans min-h-screen sm:h-screen p-3 sm:p-5 flex flex-col overflow-x-hidden text-slate-800 antialiased">

    <div class="max-w-7xl w-full mx-auto flex flex-col h-full gap-3 min-h-0">
        
        <!-- 🌟 Header Card สไตล์ iOS 🌟 -->
        <div class="bg-white px-3.5 py-2.5 sm:px-6 sm:py-3.5 rounded-3xl border border-slate-200/70 shadow-2xs flex items-center justify-between gap-2.5 flex-shrink-0">
            
            <!-- ฝั่งซ้าย: ปุ่มย้อนกลับ + ไอคอน + ชื่อหัวข้อ -->
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <button type="button" onclick="smartGoBack()" title="ปิดหน้านี้" 
                        class="w-8 h-8 sm:w-10 sm:h-10 bg-slate-50 hover:bg-slate-100 text-slate-600 hover:text-slate-900 rounded-xl sm:rounded-2xl border border-slate-200/80 transition active:scale-90 flex items-center justify-center flex-shrink-0 shadow-2xs cursor-pointer">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                
                <!-- ซ่อนบนมือถือเพื่อประหยัดพื้นที่ แสดงเฉพาะจอคอม sm ขึ้นไป -->
                <div class="hidden sm:flex w-10 h-10 bg-rose-50 text-rose-600 rounded-2xl items-center justify-center border border-rose-100/80 shadow-2xs flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                    </svg>
                </div>

                <div class="min-w-0">
                    <h1 class="text-xs sm:text-base font-bold text-slate-900 tracking-tight leading-normal truncate">เช็คของต้องซื้อ & ตรวจนับสต็อก</h1>
                    <p id="page-subtitle" class="text-[10px] sm:text-[11px] text-slate-400 font-medium mt-0.5 leading-normal truncate">ระบบจัดการและเติมสต็อกสินค้า</p>
                </div>
            </div>

            <!-- ฝั่งขวา: ปุ่มพิมพ์ใบสั่งของ (ชิดขวาสุดเสมอ) -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <button type="button" onclick="printLowStockReport()" 
                        class="px-3 sm:px-4 py-1.5 sm:py-2 bg-slate-900 hover:bg-black active:scale-95 text-white rounded-xl sm:rounded-2xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer shadow-sm whitespace-nowrap">
                    <svg class="w-3.5 h-3.5 text-slate-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                    </svg>
                    <span id="print-btn-label">พิมพ์ใบสั่งของ</span>
                </button>
            </div>
        </div>

        <!-- 🌟 แผงค้นหา & iOS Segmented Filter Control 🌟 -->
        <div class="bg-white p-3 sm:p-3.5 rounded-3xl border border-slate-200/70 shadow-2xs space-y-2.5 flex-shrink-0">
            
            <!-- แถวหลัก (คอม: รวม Search + Category + Sort ไว้แถวเดียวกัน / มือถือ: แยกบรรทัด) -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 sm:gap-2.5">
                
                <!-- 1. ช่องค้นหา + ปุ่มกล้อง -->
                <div class="flex items-center gap-1.5 flex-1 min-w-0">
                    <div class="relative flex-1 min-w-0">
                        <input type="text" id="search-input" oninput="handleSearch(this.value)" 
       placeholder="ค้นหาชื่อสินค้า หรือ รหัสบาร์โค้ด..." 
       class="w-full py-2 sm:py-2.5 pl-9 pr-14 bg-slate-100/70 hover:bg-slate-100 focus:bg-white border border-transparent focus:border-slate-300 rounded-2xl text-xs sm:text-sm font-semibold text-slate-800 transition outline-none shadow-inner leading-relaxed">
                        <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>

                    <!-- 📷 ปุ่มกล้องสแกน -->
                    <button type="button" onclick="openCameraScannerModal((code) => {
                                const s = document.getElementById('search-input');
                                if (s) {
                                    s.value = code;
                                    if (typeof handleSearch === 'function') handleSearch(code);
                                }
                            })" 
                            title="เปิดกล้องสแกนบาร์โค้ด" 
                            class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-white hover:bg-blue-50 text-slate-600 hover:text-blue-600 border border-slate-200/90 flex items-center justify-center shadow-2xs transition active:scale-95 cursor-pointer flex-shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7V5a2 2 0 012-2h2m10 0h2a2 2 0 012 2v2m0 10v2a2 2 0 01-2 2h-2m-10 0H5a2 2 0 01-2-2v-2M4 12h16"/>
                        </svg>
                    </button>
                </div>

                <!-- 2. กลุ่ม Dropdown (หมวดหมู่ + เรียงลำดับ) บน PC จะมาต่อท้าย Search ในแถวเดียวกันทันที -->
                <div class="flex items-center gap-2 flex-shrink-0">
                    <!-- Dropdown หมวดหมู่ -->
                    <div class="relative flex-1 sm:w-48 flex-shrink-0">
                        <button type="button" id="cat-dropdown-btn" onclick="toggleCatDropdown()" 
                                class="w-full h-9 sm:h-10 px-3 bg-slate-100/70 hover:bg-slate-100 border border-transparent focus:border-slate-300 rounded-2xl text-xs font-semibold text-slate-700 transition flex items-center justify-between cursor-pointer shadow-2xs">
                            <span id="cat-dropdown-label" class="truncate leading-normal">ทุกหมวดหมู่สินค้า</span>
                            <svg id="cat-dropdown-arrow" class="w-3.5 h-3.5 text-slate-400 transition-transform duration-200 flex-shrink-0 ml-1 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="cat-dropdown-menu" class="hidden absolute left-0 right-0 sm:right-auto sm:w-52 mt-1.5 bg-white border border-slate-100 rounded-2xl shadow-xl z-30 overflow-hidden py-1 text-xs max-h-52 overflow-y-auto"></div>
                    </div>

                    <!-- Dropdown เรียงลำดับ -->
                    <div class="relative flex-1 sm:w-36 flex-shrink-0">
                        <input type="hidden" id="sort-product" value="index">
                        <button type="button" id="sort-product-btn" onclick="toggleSortDropdown()" 
                                class="w-full h-9 sm:h-10 px-3.5 bg-slate-100/70 hover:bg-slate-100 border border-transparent focus:border-slate-300 rounded-2xl text-xs font-semibold text-slate-700 transition flex items-center justify-between cursor-pointer shadow-2xs">
                            <span id="sort-product-label" class="truncate">ลำดับ</span>
                            <svg id="sort-product-arrow" class="w-3.5 h-3.5 text-slate-400 transition-transform duration-200 pointer-events-none flex-shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>

                        <div id="sort-product-menu" class="hidden absolute left-0 right-0 mt-1.5 bg-white border border-slate-100 rounded-2xl shadow-xl z-30 overflow-hidden py-1 text-xs">
                            <div onclick="selectSortOption('index', 'ลำดับ')" class="px-3.5 py-1.5 hover:bg-slate-50 text-slate-800 font-bold cursor-pointer transition">ลำดับ</div>
                            <div onclick="selectSortOption('stock_asc', 'สต็อก น้อย - มาก')" class="px-3.5 py-1.5 hover:bg-slate-50 text-slate-700 cursor-pointer transition">สต็อก น้อย - มาก</div>
                            <div onclick="selectSortOption('stock_desc', 'สต็อก มาก - น้อย')" class="px-3.5 py-1.5 hover:bg-slate-50 text-slate-700 cursor-pointer transition">สต็อก มาก - น้อย</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- แถวที่ 2: ปุ่มสถานะแบบปัดแนวนอน (Swipeable) + ปุ่มเลือกทั้งหมดชิดขวา -->
            <div class="flex items-center justify-between gap-2 pt-1.5 border-t border-slate-100/80">
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 select-none flex-1 min-w-0">
                    <button type="button" id="pill-all-store" onclick="setStatusFilter('all_store', this)" 
                            class="status-pill px-3 py-1 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-50 transition active:scale-95 whitespace-nowrap cursor-pointer shadow-2xs">
                        สินค้าทั้งร้าน (0)
                    </button>
                    <button type="button" id="pill-need-buy" onclick="setStatusFilter('need_buy', this)" 
                            class="status-pill px-3 py-1 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-2xs transition active:scale-95 whitespace-nowrap cursor-pointer">
                        ของต้องซื้อ (0)
                    </button>
                    <button type="button" id="pill-out" onclick="setStatusFilter('out', this)" 
                            class="status-pill px-3 py-1 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-50 transition active:scale-95 whitespace-nowrap cursor-pointer shadow-2xs">
                        เฉพาะของหมด (0)
                    </button>
                    <button type="button" id="pill-low" onclick="setStatusFilter('low', this)" 
                            class="status-pill px-3 py-1 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-50 transition active:scale-95 whitespace-nowrap cursor-pointer shadow-2xs">
                        เฉพาะใกล้หมด (0)
                    </button>
                    <button type="button" id="pill-normal" onclick="setStatusFilter('normal', this)" 
                            class="status-pill px-3 py-1 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-50 transition active:scale-95 whitespace-nowrap cursor-pointer shadow-2xs">
                        สต็อกปกติ (0)
                    </button>
                    <button type="button" id="pill-selected" onclick="setStatusFilter('selected', this)" 
                            class="status-pill px-3 py-1 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-50 transition active:scale-95 whitespace-nowrap cursor-pointer shadow-2xs">
                        ที่เลือกไว้ (0)
                    </button>
                </div>

                <!-- Select All Checkbox Button -->
                <button type="button" onclick="toggleSelectAllBtn()" 
                        class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer whitespace-nowrap flex-shrink-0 shadow-2xs">
                    <input type="checkbox" id="check-all" class="w-3.5 h-3.5 rounded text-blue-600 border-slate-300 pointer-events-none">
                    <span>เลือกทั้งหมด</span>
                </button>
            </div>
        </div>

        <!-- 🌟 การ์ดแสดงรายการสินค้าแบบ iOS Card Grid 🌟 -->
        <div class="flex-1 overflow-y-auto pr-1 pb-4 min-h-0">
            <div id="product-card-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 min-[1800px]:grid-cols-7 gap-3"></div>
        </div>

        <!-- 🌟 แถบ Bottom Summary ลอยตัว 🌟 -->
        <div class="px-5 py-2.5 bg-white/90 backdrop-blur-md border border-slate-200/70 rounded-2xl flex items-center justify-between text-xs text-slate-500 font-medium flex-shrink-0 shadow-2xs select-none">
            <div>
                แสดงทั้งหมด <span id="showing-count" class="font-bold text-slate-900">0</span> รายการ
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center gap-1 bg-rose-50 text-rose-700 px-2.5 py-0.5 rounded-lg border border-rose-200/60 font-bold">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                    เลือกไว้: <span id="selected-count">0</span>
                </span>
            </div>
        </div>
        
    </div>
    <!-- 📷 Modal สแกนบาร์โค้ดผ่านกล้อง -->
    <div id="camera-scanner-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden transition-opacity duration-150">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-slate-100 flex flex-col items-center relative animate-in fade-in zoom-in-95">
            <div class="flex items-center justify-between w-full pb-3 border-b border-slate-100">
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-bold text-xs">📷</div>
                    <h3 class="font-bold text-sm text-slate-800">สแกนบาร์โค้ดสินค้า</h3>
                </div>
                <button type="button" onclick="closeCameraScannerModal()" class="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-xs font-bold transition">✕</button>
            </div>

            <!-- จอภาพกล้อง -->
            <div class="w-full mt-3 rounded-2xl overflow-hidden bg-black border border-slate-200 relative min-h-[260px] flex items-center justify-center">
                <div id="camera-reader-viewport" class="w-full h-full"></div>
                <div class="pointer-events-none absolute w-[240px] h-[2px] bg-rose-500 shadow-[0_0_10px_#f43f5e] z-20 animate-laser"></div>
            </div>

            <p class="text-[11px] text-slate-400 mt-3 text-center">ส่องบาร์โค้ดบนสินค้าให้อยู่ในกรอบเพื่อค้นหาสต็อก</p>
        </div>
    </div>
    <iframe id="print-iframe" class="hidden"></iframe>

    <script src="js/low_stock.js"></script>
    <script src="js/keyboard.js"></script>
    <script>
        let cameraScannerInstance = null;
        let scannerCallback = null;

        function openCameraScannerModal(callbackAction = null) {
            scannerCallback = callbackAction;
            const modal = document.getElementById('camera-scanner-modal');
            if (!modal) return;
            modal.classList.remove('hidden');

            if (!cameraScannerInstance) {
                cameraScannerInstance = new Html5Qrcode("camera-reader-viewport");
            }

            const config = {
                fps: 15,
                qrbox: { width: 250, height: 160 },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.QR_CODE
                ]
            };

            cameraScannerInstance.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    const cleanCode = decodedText.trim();

                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = audioCtx.createOscillator();
                        osc.type = 'sine';
                        osc.frequency.value = 1000;
                        osc.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.1);
                    } catch(e) {}

                    if (typeof scannerCallback === 'function') {
                        scannerCallback(cleanCode);
                    }

                    closeCameraScannerModal();
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("ไม่สามารถเปิดกล้องได้: ตรวจสอบสิทธิ์การเข้าถึงกล้อง");
                closeCameraScannerModal();
            });
        }

        function closeCameraScannerModal() {
            const modal = document.getElementById('camera-scanner-modal');
            scannerCallback = null;
            if (cameraScannerInstance && cameraScannerInstance.isScanning) {
                cameraScannerInstance.stop().then(() => {
                    if (modal) modal.classList.add('hidden');
                }).catch(err => {
                    if (modal) modal.classList.add('hidden');
                });
            } else {
                if (modal) modal.classList.add('hidden');
            }
        }
    </script>
    <script src="js/sidebar.js"></script>
    <script>
        function smartGoBack() {
            if (window.self !== window.top && window.parent && typeof window.parent.closePosDrawer === 'function') {
                window.parent.closePosDrawer();
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
